repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # .agents/data/keywords.json es un archivo de datos deliberado (unos 2,6 MB), ver CLAUDE.md "Investigación de keywords"
        exclude: ^\.agents/data/keywords\.json$

  # Biome (biome.json), la misma version que package.json. Formatea solo los archivos que el commit toca.
  - repo: local
    hooks:
      - id: biome-format
        name: biome format
        entry: bunx biome format --write --no-errors-on-unmatched --files-ignore-unknown=true
        language: system
        types_or: [ts, javascript, svelte, css]
